name: branch-deploy

on:
  issue_comment:
    types: [ created ]

env:
  WORKING_DIR: terraform/

# Permissions needed for reacting and adding comments for IssueOps commands
permissions:
  pull-requests: write
  deployments: write
  contents: write
  checks: read
  statuses: read

jobs:
  branch-deploy:
    name: branch-deploy
    if: # only run on pull request comments and very specific comment body string as defined in our branch-deploy settings
      ${{ github.event.issue.pull_request &&
      (startsWith(github.event.comment.body, '.deploy') ||
      startsWith(github.event.comment.body, '.noop') ||
      startsWith(github.event.comment.body, '.lock') ||
      startsWith(github.event.comment.body, '.help') ||
      startsWith(github.event.comment.body, '.wcid') ||
      startsWith(github.event.comment.body, '.unlock')) }}
    runs-on: ubuntu-latest
    environment:
      name: production
      deployment: false

    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: branch-deploy
        id: branch-deploy
        uses: github/branch-deploy@f0984057ffe1aa340aa017b6eafb894310aed88e # pin@v12.0.0
        with:
          admins: GrantBirki,Razzmatazzz
          environment_targets: production
          sticky_locks: "true"

      - name: checkout
        if: steps.branch-deploy.outputs.continue == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # pin@v6
        with:
          ref: ${{ steps.branch-deploy.outputs.sha }}

      - name: read terraform version
        id: terraform-version
        if: steps.branch-deploy.outputs.continue == 'true'
        working-directory: .
        run: echo "version=$(cat .terraform-version)" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # pin@v4.0.1
        if: steps.branch-deploy.outputs.continue == 'true'
        with:
          terraform_version: ${{ steps.terraform-version.outputs.version }}
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform init
        if: steps.branch-deploy.outputs.continue == 'true'
        run: terraform init

      - name: Terraform plan
        if: ${{ steps.branch-deploy.outputs.continue == 'true' && steps.branch-deploy.outputs.noop == 'true' }}
        env:
          TF_VAR_CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
        id: plan
        continue-on-error: true
        run: |
          set -o pipefail
          terraform plan -no-color -compact-warnings | tee "${RUNNER_TEMP}/terraform-output.txt"

      - name: Terraform apply
        if: ${{ steps.branch-deploy.outputs.continue == 'true' && steps.branch-deploy.outputs.noop != 'true' }}
        env:
          TF_VAR_CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
        id: apply
        continue-on-error: true
        run: |
          set -o pipefail
          terraform apply -no-color -auto-approve -compact-warnings | tee "${RUNNER_TEMP}/terraform-output.txt"

      - name: terratrash
        if: ${{ steps.branch-deploy.outputs.continue == 'true' }}
        uses: GrantBirki/terratrash-action@f4b67b8ee0925ff4ed28bd20c44bebbd16e8f892 # pin@v1.0.0
        with:
          input_file_path: ${{ runner.temp }}/terraform-output.txt
          output_file_path: ${{ runner.temp }}/terraform-output-fmt.txt

      - name: Set deployment message
        if: ${{ steps.branch-deploy.outputs.continue == 'true' }}
        shell: bash
        env:
          DEPLOYMENT_RESULTS_PATH: ${{ runner.temp }}/terraform-output-fmt.txt
        run: |
          set -euo pipefail

          if [[ -L "$DEPLOYMENT_RESULTS_PATH" || ! -f "$DEPLOYMENT_RESULTS_PATH" || ! -r "$DEPLOYMENT_RESULTS_PATH" ]]; then
            printf '%s\n' 'The deployment message is not a readable regular file.' >&2
            exit 1
          fi

          new_delimiter() {
            printf 'branch_deploy_%s' "$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
          }

          while :; do
            delimiter="$(new_delimiter)"

            if [[ ! "$delimiter" =~ ^branch_deploy_[0-9a-f]{32}$ ]]; then
              printf '%s\n' 'Failed to create a safe deployment-message delimiter.' >&2
              exit 1
            fi

            if LC_ALL=C grep -Fxq -- "$delimiter" "$DEPLOYMENT_RESULTS_PATH"; then
              continue
            else
              scan_status=$?
              if [[ "$scan_status" -ne 1 ]]; then
                printf '%s\n' 'Failed to verify the deployment-message delimiter.' >&2
                exit 1
              fi
            fi
            break
          done

          needs_separator=false
          if [[ -s "$DEPLOYMENT_RESULTS_PATH" ]]; then
            final_byte="$(tail -c 1 "$DEPLOYMENT_RESULTS_PATH" | od -An -tx1 | tr -d '[:space:]')"
            if [[ ! "$final_byte" =~ ^[0-9a-f]{2}$ ]]; then
              printf '%s\n' 'Failed to inspect the final deployment-message byte.' >&2
              exit 1
            fi
            if [[ "$final_byte" != 0a ]]; then
              needs_separator=true
            fi
          fi

          {
            printf 'DEPLOY_MESSAGE<<%s\n' "$delimiter"
            cat "$DEPLOYMENT_RESULTS_PATH"
            if [[ "$needs_separator" == true ]]; then
              printf '\n'
            fi
            printf '%s\n' "$delimiter"
          } >> "$GITHUB_ENV"

      - name: Check Terraform plan output
        if: ${{ steps.branch-deploy.outputs.continue == 'true' && steps.branch-deploy.outputs.noop == 'true' && steps.plan.outcome == 'failure' }}
        run: exit 1

      - name: Check Terraform apply output
        if: ${{ steps.branch-deploy.outputs.continue == 'true' && steps.branch-deploy.outputs.noop != 'true' && steps.apply.outcome == 'failure' }}
        run: exit 1
